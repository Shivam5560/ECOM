name: ecom

x-backend-image: &backend-image ecom-backend:local
x-backend-build: &backend-build
  context: .
  dockerfile: docker/service.Dockerfile

services:
  # ---------------------------------------------------------------------------
  # Frontend — serves static React build; proxies /api/v1/* → Traefik gateway
  # ---------------------------------------------------------------------------
  frontend:
    image: nginx:latest
    container_name: ecommerce-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    stop_grace_period: 3s
    networks:
      - default

  # ---------------------------------------------------------------------------
  # Backend Microservices
  # Each service registers itself in Consul via consul-sidecar (see below).
  # Traefik reads the Consul catalog and routes /api/v1/<prefix>/* accordingly.
  #
  # Consul registration uses environment variables read by the entrypoint script
  # in the service image. We use a lightweight consul-registrator sidecar approach:
  # the CONSUL_* env vars tell our startup wrapper what to register.
  # ---------------------------------------------------------------------------

  auth-service:
    image: *backend-image
    build: *backend-build
    container_name: ecommerce-auth-service
    environment:
      MODULE: auth_service.controller.main:create_app
      AUTH_DATABASE_URL: postgresql+psycopg2://ecom:ecom@postgres:5432/ecom?options=-csearch_path%3Dauth
      CONSUL_SERVICE_NAME: auth-service
      CONSUL_SERVICE_PORT: "8000"
      CONSUL_SERVICE_TAGS: "traefik.enable=true,traefik.http.routers.auth.rule=PathPrefix(`/api/v1/auth`),traefik.http.services.auth-service.loadbalancer.server.port=8000"
      CONSUL_ADDR: consul:8500
    ports:
      - "8001:8000"
    stop_grace_period: 5s
    networks:
      - default

  user-service:
    image: *backend-image
    pull_policy: never
    container_name: ecommerce-user-service
    environment:
      MODULE: user_service.controller.main:create_app
      USER_DATABASE_URL: postgresql+psycopg2://ecom:ecom@postgres:5432/ecom?options=-csearch_path%3Dusers
      AUTH_SERVICE_URL: http://auth-service:8000
      REDIS_URL: redis://redis:6379/0
      CONSUL_SERVICE_NAME: user-service
      CONSUL_SERVICE_PORT: "8000"
      CONSUL_SERVICE_TAGS: "traefik.enable=true,traefik.http.routers.users.rule=PathPrefix(`/api/v1/users`),traefik.http.services.user-service.loadbalancer.server.port=8000"
      CONSUL_ADDR: consul:8500
    ports:
      - "8002:8000"
    stop_grace_period: 5s
    networks:
      - default

  product-service:
    image: *backend-image
    pull_policy: never
    container_name: ecommerce-product-service
    environment:
      MODULE: product_service.controller.main:create_app
      PRODUCT_DATABASE_URL: postgresql+psycopg2://ecom:ecom@postgres:5432/ecom?options=-csearch_path%3Dproducts
      USER_SERVICE_URL: http://user-service:8000
      REDIS_URL: redis://redis:6379/0
      CONSUL_SERVICE_NAME: product-service
      CONSUL_SERVICE_PORT: "8000"
      CONSUL_SERVICE_TAGS: "traefik.enable=true,traefik.http.routers.products.rule=PathPrefix(`/api/v1/products`),traefik.http.services.product-service.loadbalancer.server.port=8000"
      CONSUL_ADDR: consul:8500
    ports:
      - "8003:8000"
    stop_grace_period: 5s
    networks:
      - default

  order-service:
    image: *backend-image
    pull_policy: never
    container_name: ecommerce-order-service
    environment:
      MODULE: order_service.controller.main:create_app
      ORDER_DATABASE_URL: postgresql+psycopg2://ecom:ecom@postgres:5432/ecom?options=-csearch_path%3Dorders
      PRODUCT_DATABASE_URL: postgresql+psycopg2://ecom:ecom@postgres:5432/ecom?options=-csearch_path%3Dproducts
      PRODUCT_SERVICE_URL: http://traefik  # routes through Traefik gateway, not direct to container
      USER_SERVICE_URL: http://user-service:8000
      REDIS_URL: redis://redis:6379/0
      CONSUL_SERVICE_NAME: order-service
      CONSUL_SERVICE_PORT: "8000"
      CONSUL_SERVICE_TAGS: "traefik.enable=true,traefik.http.routers.orders.rule=PathPrefix(`/api/v1/orders`),traefik.http.services.order-service.loadbalancer.server.port=8000"
      CONSUL_ADDR: consul:8500
    ports:
      - "8004:8000"
    stop_grace_period: 5s
    networks:
      - default

  payment-service:
    image: *backend-image
    pull_policy: never
    container_name: ecommerce-payment-service
    environment:
      MODULE: payment_service.controller.main:create_app
      PAYMENT_DATABASE_URL: postgresql+psycopg2://ecom:ecom@postgres:5432/ecom?options=-csearch_path%3Dpayments
      CONSUL_SERVICE_NAME: payment-service
      CONSUL_SERVICE_PORT: "8000"
      CONSUL_SERVICE_TAGS: "traefik.enable=true,traefik.http.routers.payments.rule=PathPrefix(`/api/v1/payments`),traefik.http.services.payment-service.loadbalancer.server.port=8000"
      CONSUL_ADDR: consul:8500
    ports:
      - "8007:8000"
    stop_grace_period: 5s
    networks:
      - default

  invoice-service:
    image: *backend-image
    pull_policy: never
    container_name: ecommerce-invoice-service
    environment:
      MODULE: invoice_service.controller.main:create_app
      INVOICE_DATABASE_URL: postgresql+psycopg2://ecom:ecom@postgres:5432/ecom?options=-csearch_path%3Dinvoices
      CONSUL_SERVICE_NAME: invoice-service
      CONSUL_SERVICE_PORT: "8000"
      CONSUL_SERVICE_TAGS: "traefik.enable=true,traefik.http.routers.invoices.rule=PathPrefix(`/api/v1/invoices`),traefik.http.services.invoice-service.loadbalancer.server.port=8000"
      CONSUL_ADDR: consul:8500
    ports:
      - "8008:8000"
    stop_grace_period: 5s
    networks:
      - default

  notification-service:
    image: *backend-image
    pull_policy: never
    container_name: ecommerce-notification-service
    environment:
      MODULE: notification_service.controller.main:create_app
      CONSUL_SERVICE_NAME: notification-service
      CONSUL_SERVICE_PORT: "8000"
      CONSUL_SERVICE_TAGS: "traefik.enable=true,traefik.http.routers.notifications.rule=PathPrefix(`/api/v1/notifications`),traefik.http.services.notification-service.loadbalancer.server.port=8000"
      CONSUL_ADDR: consul:8500
    ports:
      - "8005:8000"
    stop_grace_period: 5s
    networks:
      - default

  workflow-service:
    image: *backend-image
    pull_policy: never
    container_name: ecommerce-workflow-service
    environment:
      MODULE: workflow_service.controller.main:create_app
      WORKFLOW_DATABASE_URL: postgresql+psycopg2://ecom:ecom@postgres:5432/ecom?options=-csearch_path%3Dworkflow
      CONDUCTOR_SERVER_URL: http://conductor:8080/api
      CONSUL_SERVICE_NAME: workflow-service
      CONSUL_SERVICE_PORT: "8000"
      CONSUL_SERVICE_TAGS: "traefik.enable=true,traefik.http.routers.workflows.rule=PathPrefix(`/api/v1/workflows`),traefik.http.services.workflow-service.loadbalancer.server.port=8000,traefik.http.routers.tasks.rule=PathPrefix(`/api/v1/tasks`),traefik.http.routers.tasks.service=workflow-service"
      CONSUL_ADDR: consul:8500
    ports:
      - "8006:8000"
    stop_grace_period: 5s
    networks:
      - default

networks:
  default:
    name: ecom_default
    external: true
