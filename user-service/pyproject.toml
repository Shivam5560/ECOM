[project]
name = "user-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "core-common",
  "msg-common",
  "fastapi==0.115.*",
  "uvicorn[standard]==0.30.*",
  "pydantic==2.7.*",
  "sqlalchemy==2.0.*",
  "psycopg2-binary==2.9.*",
  "alembic==1.13.*",
  "asyncpg==0.29.*",
  "httpx==0.27.*",
  "bcrypt==4.*",
]

[tool.uv.sources]
core-common = { workspace = true }
msg-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.23,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "app"
module-name = "user_service"
